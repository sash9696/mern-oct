      }

      .quote::before{
        content: "“";
        font-size: 3rem;
        position: absolute;
        top: -10px;
        left: 5px;
      }

      .quote::after{
        content: "”";
        font-size: 3rem;
        position: absolute;
        top: -10px;

      }
    </style>
